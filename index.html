<style>
/* Layout: the map fills the screen; phones get a draggable bottom sheet, desktops a 420px left rail */
:root {
  --sea: #cfe3e0; --land: #f5f5ef; --lake: #b7d6d3; --park: #e6eedf;
  --road: #ffffff; --road-edge: #d6d1c0; --road-minor: #e4e0d3;
  --ink: #14302c; --ink-2: #4a605b; --ink-3: #7b8e89;
  --panel: #ffffff; --panel-2: #f2f6f3; --line: #dfe7e3;
  --accent: #0b6e64; --accent-ink: #ffffff; --accent-soft: #e1f1ee;
  --gold: #c9921a; --good: #15803d; --warn: #b45309; --bad: #b42318;
  --d1: #2f6fd6; --d2: #0f8b6f; --d3: #d9590f; --d4: #8a46c4; --d5: #b8860b; --d6: #d63a73; --d7: #8b5a2b; --d8: #475569;
  --shadow: 0 10px 30px rgba(14, 44, 40, .16);
  --f-display: 'Hahmlet', 'Noto Serif KR', 'Batang', Georgia, serif;
  --f-body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --rail: 420px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0d1b1e; --land: #1a2623; --lake: #10282b; --park: #1c2b23;
    --road: #3b4b47; --road-edge: #22302d; --road-minor: #2c3a37;
    --ink: #e5efec; --ink-2: #a8bab5; --ink-3: #788c87;
    --panel: #131d1b; --panel-2: #1a2725; --line: #283633;
    --accent: #40b8a8; --accent-ink: #062320; --accent-soft: #163733;
    --gold: #e6b53c; --good: #4ade80; --warn: #f59e0b; --bad: #f87171;
    --d1: #6ea0f5; --d2: #3cc39f; --d3: #f08a4b; --d4: #b98cf0; --d5: #e3bb3d; --d6: #f17aa5; --d7: #c99566; --d8: #9aa8bb;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0d1b1e; --land: #1a2623; --lake: #10282b; --park: #1c2b23;
  --road: #3b4b47; --road-edge: #22302d; --road-minor: #2c3a37;
  --ink: #e5efec; --ink-2: #a8bab5; --ink-3: #788c87;
  --panel: #131d1b; --panel-2: #1a2725; --line: #283633;
  --accent: #40b8a8; --accent-ink: #062320; --accent-soft: #163733;
  --gold: #e6b53c; --good: #4ade80; --warn: #f59e0b; --bad: #f87171;
  --d1: #6ea0f5; --d2: #3cc39f; --d3: #f08a4b; --d4: #b98cf0; --d5: #e3bb3d; --d6: #f17aa5; --d7: #c99566; --d8: #9aa8bb;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--panel); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: 0; }
#map { position: absolute; inset: 0; background: var(--sea); z-index: 0; }
.leaflet-container { background: var(--sea); font-family: var(--f-body); }
.leaflet-control-attribution { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--ink-3) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-bar a:hover { background: var(--panel-2); }

/* ---------- top bar ---------- */
.topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 500; padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 8px;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--panel) 96%, transparent) 70%, color-mix(in srgb, var(--panel) 0%, transparent)); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 26px; height: 26px; flex: none; color: var(--accent); }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0; letter-spacing: -.01em; line-height: 1.15; }
.brand p { margin: 0; font-size: 11.5px; color: var(--ink-2); }
.brand .spacer { flex: 1; }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; }
.iconbtn svg { width: 18px; height: 18px; }
.days { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
.days::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-3)); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--panel); }
.chip small { color: inherit; opacity: .7; font-size: 11px; }

/* ---------- sheet / rail ---------- */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 600; background: var(--panel); border-radius: 18px 18px 0 0; box-shadow: var(--shadow);
  height: var(--sheet-h, 42%); display: flex; flex-direction: column; transition: height .25s ease; padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet.dragging { transition: none; }
.handle { flex: none; height: 22px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.handle span { width: 40px; height: 4px; border-radius: 4px; background: var(--line); }
.summary { flex: none; padding: 0 16px 8px; display: grid; gap: 6px; }
.tabs { flex: none; display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 0; background: none; padding: 9px 10px 8px; font-size: 13.5px; color: var(--ink-2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.panes { flex: 1; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.pane { padding: 12px 16px 28px; display: grid; gap: 12px; align-content: start; }

@media (min-width: 900px) {
  .topbar { width: var(--rail); right: auto; background: var(--panel); border-right: 1px solid var(--line); padding-bottom: 10px; }
  .sheet { top: var(--top-h, 112px); left: 0; right: auto; width: var(--rail); height: auto !important; border-radius: 0; box-shadow: none; border-right: 1px solid var(--line); }
  .handle { display: none; }
  #map { left: var(--rail); }
}

/* ---------- summary strip ---------- */
.sumrow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sumrow h2 { font-family: var(--f-display); font-size: 16px; margin: 0; font-weight: 700; }
.sumrow .meta { color: var(--ink-2); font-size: 12.5px; }
.meter { position: relative; height: 8px; background: var(--panel-2); border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); border-radius: 8px; transition: width .3s ease, background .3s; }
.meter b { position: absolute; top: -2px; bottom: -2px; width: 1.5px; background: var(--ink-3); }
.meterlabel { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-2); }
.meterlabel strong { color: var(--ink); font-weight: 600; }

/* ---------- generic blocks ---------- */
.section-title { font-family: var(--f-display); font-weight: 700; font-size: 15px; margin: 6px 0 0; }
.hint { color: var(--ink-2); font-size: 12.5px; margin: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: var(--panel); padding: 8px 6px; font-size: 12.5px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.small { padding: 4px 9px; font-size: 12px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
select, input[type="number"], input[type="time"] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }

/* ---------- day cards ---------- */
.day { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); }
.day.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.dayhead { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; cursor: pointer; background: var(--panel-2); border: 0; width: 100%; text-align: left; }
.daybadge { width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.dayhead h3 { margin: 0; font-size: 14px; font-weight: 600; }
.dayhead p { margin: 0; font-size: 11.5px; color: var(--ink-2); }
.daystats { text-align: right; font-size: 11.5px; color: var(--ink-2); line-height: 1.35; }
.daystats strong { color: var(--ink); font-size: 12.5px; }
.timeline { list-style: none; margin: 0; padding: 6px 12px 10px; display: grid; }
.tl { display: grid; grid-template-columns: 44px 22px 1fr auto; gap: 8px; align-items: center; min-height: 34px; }
.tl .t { font-size: 12px; color: var(--ink-2); text-align: right; }
.tl .pin { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--c); }
.tl .pin.home { background: var(--panel); color: var(--c); border: 2px solid var(--c); }
.tl .pin svg { width: 12px; height: 12px; }
.tl .name { min-width: 0; }
.tl .name b { font-weight: 600; font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.tl .name span { font-size: 11.5px; color: var(--ink-2); }

// Speeds are Bali-realistic door-to-door averages (km/h) by road class:

};

function decodePairs(arr) {
  const out = new Float64Array(arr.length);
  let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; out[i] = x / 1e5; out[i + 1] = y / 1e5; }
  return out; // [lon, lat, lon, lat, ...]
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (lat2 - lat1) * r, dLon = (lon2 - lon1) * r;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

class MinHeap {
  constructor() { this.k = []; this.v = []; }
  get size() { return this.k.length; }
  push(key, val) {
    const k = this.k, v = this.v; let i = k.length; k.push(key); v.push(val);
    while (i > 0) { const p = (i - 1) >> 1; if (k[p] <= key) break; k[i] = k[p]; v[i] = v[p]; i = p; }
    k[i] = key; v[i] = val;
  }
  pop() {
    const k = this.k, v = this.v, top = v[0], lastK = k.pop(), lastV = v.pop(), n = k.length;
    if (n) {
      let i = 0;
      while (true) {
        let c = 2 * i + 1; if (c >= n) break;
        if (c + 1 < n && k[c + 1] < k[c]) c++;
        if (k[c] >= lastK) break;
        k[i] = k[c]; v[i] = v[c]; i = c;
      }
      k[i] = lastK; v[i] = lastV;
    }
    return top;
  }
}

function buildGraph(BASE) {
  const nd = decodePairs(BASE.nodes);
  const N = nd.length / 2;
  const lon = new Float64Array(N), lat = new Float64Array(N);
  for (let i = 0; i < N; i++) { lon[i] = nd[2 * i]; lat[i] = nd[2 * i + 1]; }
  const adj = Array.from({ length: N }, () => []);
  const minCls = new Uint8Array(N).fill(9);
  // union-find for components
  const par = new Int32Array(N); for (let i = 0; i < N; i++) par[i] = i;
  const find = x => { while (par[x] !== x) { par[x] = par[par[x]]; x = par[x]; } return x; };
  for (const w of BASE.ways) {
    const c = w[0], ow = w[1];
    for (let k = 2; k < w.length; k++) { if (c < minCls[w[k]]) minCls[w[k]] = c; }

  let ring = null;
  function visiblePad() {
    const wide = window.innerWidth >= 900;
    return { paddingTopLeft: [50, wide ? 50 : $('#topbar').offsetHeight + 50], paddingBottomRight: [50, wide ? 50 : $('#sheet').offsetHeight + 120] };
  }
  function draw(id, move) {
    const p = P[id]; if (!p) return;
    if (ring) map.removeLayer(ring);
    ring = L.marker([p.lat, p.lng], { keyboard: false, zIndexOffset: 2000,
      icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="hlring"><span></span><b>${esc(p.ko)} · 상세 보기</b></div>` }) }).addTo(map);
    ring.on('click', () => openDetail(id));
    if (move) {
      const z = Math.max(map.getZoom(), 12);
      if (map.getZoom() < 12) map.setView([p.lat, p.lng], z, { animate: true });
      try { map.panInside([p.lat, p.lng], { ...visiblePad(), animate: true, duration: 0.35 }); } catch (e) { /* ignore */ }
    }
  }
  function pick(id) {
    S.sel = id;
    document.querySelectorAll('.card.sel').forEach(el => el.classList.remove('sel'));
    document.querySelectorAll(`.card[data-hl="${CSS.escape(id)}"]`).forEach(el => el.classList.add('sel'));
    draw(id, true);
  }
  return { pick, redraw() { if (S.sel && P[S.sel] && (S.tab === 'options' || S.tab === 'stays')) draw(S.sel, false); else if (ring) { map.removeLayer(ring); ring = null; } }, reset() { if (ring) { map.removeLayer(ring); ring = null; } } };
})();
window.HLreset = () => { S.sel = null; HL.reset(); };
// ---------- render ----------
function render(refit) {
  const days = HAS ? allDays() : [];
  lastDays = days;
  const bud = HAS ? budget(days) : null;
  renderChips(days); renderTabs();
  const onChip = document.querySelector('#dayChips [aria-pressed="true"]'); if (onChip) onChip.scrollIntoView({ block: 'nearest', inline: 'nearest' }); renderSummary(days, bud); renderPanes(days, bud); renderMap(days);
  if (refit) fit(boundsFor(days));
  HL.redraw();
  const act = S.view !== 'all' && document.getElementById('day-' + S.view);
  if (act && S.tab === 'plan' && refit) act.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  save();
}
syncTop();
roadWeights();
map.fitBounds(L.latLngBounds([[-8.86, 114.98], [-8.12, 115.72]]), { padding: [10, 10] });
if (window.innerWidth < 900) setSheet(S.sheet || 'half');
render(HAS);
if (SY.enabled) {
  const m = location.hash.match(/^#sync-([a-z0-9-]{20,64})$/);
  if (m && m[1] !== SY.st.room) SY.join(m[1]).then(() => { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } });
  else if (SY.st.room) SY.pull(false);
}
if (!HAS) { setTimeout(() => renderCalc(), 0); }
})();

</script>
